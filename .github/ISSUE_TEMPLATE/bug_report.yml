name: Bug Report
description: Report a problem with Renice³
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with Renice³.

        Before submitting:
        - Check if the issue already exists.
        - Test the latest available version of the modpack if possible.
        - Do not remove required fields. Issues without enough information may be closed.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Existing issue check
      options:
        - label: I have searched the existing issues and did not find a duplicate.
          required: true

  - type: input
    id: modpack-version
    attributes:
      label: Modpack version
      description: "Example: 1.0-alpha"
      placeholder: "1.0-alpha"
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: "Example: 26.1.2"
      placeholder: "26.1.2"
    validations:
      required: true

  - type: dropdown
    id: launcher
    attributes:
      label: Launcher
      description: Which launcher are you using?
      options:
        - Modrinth App
        - CurseForge App
        - Prism Launcher
        - MultiMC
        - ATLauncher
        - Official Minecraft Launcher
        - Other
    validations:
      required: true

  - type: dropdown
    id: world-type
    attributes:
      label: Where does the problem happen?
      options:
        - Singleplayer
        - Multiplayer server
        - Both
        - Cannot reach main menu
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Describe what happened.
      placeholder: "The game crashes when..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste latest.log, crash report, or a link to it. Use mclo.gs, GitHub Gist, Pastebin, or attach the file.
      placeholder: Paste logs here or add a link...
      render: shell
    validations:
      required: true

  - type: textarea
    id: modifications
    attributes:
      label: Modified instance
      description: Did you add, remove, or update any mods, shaders, resource packs, or configs?
      placeholder: |
        - Added mods:
        - Removed mods:
        - Shaders/resource packs:
        - Config changes:
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Add screenshots or a short video if it helps explain the issue.
    validations:
      required: false
